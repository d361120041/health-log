services:
  # PostgreSQL 資料庫服務
  postgres:
    container_name: health-log-postgres
    image: postgres:18.1-alpine
    restart: no
    environment:
      TZ: Asia/Taipei
      POSTGRES_DB: ${POSTGRES_DB:-health-log}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./health-log-java/app-web/src/main/resources/db/init-replica.sql:/docker-entrypoint-initdb.d/init-replica.sql
    command: ["postgres", "-c", "wal_level=replica"]
    networks:
      - health-log-network

  # Redis 快取服務
  redis:
    container_name: health-log-redis
    image: redis:7.0.15-alpine
    restart: no
    environment:
      TZ: Asia/Taipei
    ports:
      - ${REDIS_PORT:-6379}:6379
    volumes:
      - redis_data:/data
    networks:
      - health-log-network

  # Java 後端服務
  health-log-java:
    container_name: health-log-java
    build:
      context: ./health-log-java
      dockerfile: Dockerfile
    restart: no
    depends_on:
      - postgres
      - redis
    environment:
      TZ: Asia/Taipei
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-health-log}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      HEALTH_LOG_JAVA_PORT: ${HEALTH_LOG_JAVA_PORT:-8080}
      HEALTH_LOG_VUE_PROTOCOL: ${HEALTH_LOG_VUE_PROTOCOL:-http}
      HEALTH_LOG_VUE_HOST: ${HEALTH_LOG_VUE_HOST:-health-log-vue}
      HEALTH_LOG_VUE_PORT: ${HEALTH_LOG_VUE_PORT:-80}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local,dev}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-this-in-production-minimum-256-bits}
    ports:
      - ${HEALTH_LOG_JAVA_PORT:-8080}:8080
    networks:
      - health-log-network

  # Vue.js 前端服務
  health-log-vue:
    container_name: health-log-vue
    build:
      context: ./health-log-vue
      dockerfile: Dockerfile
    restart: no
    depends_on:
      - health-log-java
    environment:
      TZ: Asia/Taipei
    ports:
      - ${HEALTH_LOG_VUE_PORT:-80}:80
    networks:
      - health-log-network

volumes:
  postgres_data:
  redis_data:
  
networks:
  health-log-network:
    driver: bridge